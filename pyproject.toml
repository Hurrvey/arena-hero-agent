[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "arena-hero-agent"
version = "1.1.0"
description = "Local deterministic Arena Hero agent and tactical console"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "arena-hero>=0.2.9,<0.3",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "playwright>=1.58,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = [
  ".git",
  ".venv",
  ".worktrees",
  ".codex_tmp",
  "adaptive",
  "data",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["adaptive", "data", ".codex_tmp"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
